name: Сборка и публикация
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # раз в сутки: сдвиг блока ссылок на главной
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сдвиг ротации (только по расписанию)
        if: github.event_name == 'schedule'
        run: |
          node build.mjs --rotate
          git config user.name "rotation-bot"
          git config user.email "rotation-bot@users.noreply.github.com"
          git add data/rotation-state.json
          git diff --cached --quiet || (git commit -m "Ротация ссылок на главной" && git push)
      - name: Сборка
        run: node build.mjs
      - name: Проверка
        run: node scripts/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
